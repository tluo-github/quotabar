<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f6ef">
<title>Quotlet</title>
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="landing" class="landing" hidden>
  <img src="/icon.png" alt="">
  <h1>Quotlet</h1>
  <p data-i18n="在网站和手机上查看 Claude 与 Codex 的额度、会话和用量趋势。">在网站和手机上查看 Claude 与 Codex 的额度、会话和用量趋势。</p>
  <a class="btn" href="/login" data-i18n="登录">登录</a>
</div>

<div id="shell" hidden>
  <header>
    <div class="bar">
      <div class="left">
        <a class="brand" href="#/"><img src="/icon.png" alt="">Quotlet</a>
        <nav>
          <a href="#/" data-nav="overview" data-i18n="概览">概览</a>
          <a href="#/sessions" data-nav="sessions" data-i18n="会话">会话</a>
          <a href="#/stats" data-nav="stats" data-i18n="分析">分析</a>
          <a href="#/devices" data-nav="devices" data-i18n="设备">设备</a>
        </nav>
      </div>
      <div class="right">
        <a class="settings-link" href="#/settings" data-nav="settings" data-i18n="设置">设置</a>
        <a class="avatar" id="avatar" href="#/settings"></a>
      </div>
    </div>
  </header>
  <main id="view"></main>
</div>
<div id="alerts" class="alerts" aria-live="polite"></div>
<script src="/preferences.js"></script>
<script src="/analytics.js"></script>
<script src="/app.js"></script>
</body>
</html>
