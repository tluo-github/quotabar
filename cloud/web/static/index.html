<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FAFAF8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1C1E" media="(prefers-color-scheme: dark)">
<title>Quotlet</title>
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="landing" class="landing" hidden>
  <img src="/icon.png" alt="">
  <h1>Quotlet</h1>
  <p>在网站和手机上查看 Claude 额度、会话和执行状态。</p>
  <a class="btn" href="/login">登录</a>
</div>

<div id="shell" hidden>
  <header>
    <div class="bar">
      <div class="left">
        <a class="brand" href="#/"><img src="/icon.png" alt="">Quotlet</a>
        <nav>
          <a href="#/" data-nav="overview">概览</a>
          <a href="#/sessions" data-nav="sessions">会话</a>
          <a href="#/stats" data-nav="stats">统计</a>
          <a href="#/devices" data-nav="devices">设备</a>
        </nav>
      </div>
      <div class="right">
        <div class="seg" role="group" aria-label="外观">
          <button type="button" data-theme-set="auto" aria-label="跟随系统" title="跟随系统"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button>
          <button type="button" data-theme-set="light" aria-label="浅色" title="浅色"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg></button>
          <button type="button" data-theme-set="dark" aria-label="深色" title="深色"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
        </div>
        <a class="avatar" id="avatar" href="#/devices"></a>
      </div>
    </div>
  </header>
  <main id="view"></main>
</div>
<script src="/app.js"></script>
</body>
</html>
